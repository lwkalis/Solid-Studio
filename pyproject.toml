[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solid-studio"
version = "0.1.0"
description = "A desktop parametric solid-modeling workspace"
requires-python = ">=3.10,<3.14"
dependencies = [
    "cadquery==2.7.0; python_version == '3.10'",
    "cadquery==2.8.0; python_version >= '3.11'",
    "PySide6-Essentials==6.8.3",
]

[project.gui-scripts]
solid-studio = "solidstudio.ui:main"

[tool.setuptools.packages.find]
include = ["solidstudio*"]
